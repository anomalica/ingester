names:
  image: anomalica-ingester-pdf
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ~/.local/bin/claude:/usr/local/bin/claude:ro
    - ~/.claude:~/.claude

stages:
  base:
    from: python:3.12-slim
    steps:
      - apt-get:
          install:
            - curl
      - pip:
          install:
            - docling-core
            - pikepdf
            - pydantic

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  ingest:
    command: python workspace/ingest_pdf.py
    description: Extract structured content from a PDF
    env:
      PYTHONUNBUFFERED: "1"
    mounts:
      input:
        mode: ro
        prefix: "--input "
      output:
        mode: rw
        prefix: "--output "
