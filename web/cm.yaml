names:
  image: anomalica-ingester-web
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ../output:/mnt/output:rw
    - ../shared:/mnt/shared:ro

stages:
  base:
    from: python:3.12-slim
    steps:
      - env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      - apt-get:
          install:
            - libnss3
            - libnspr4
            - libatk1.0-0
            - libatk-bridge2.0-0
            - libcups2
            - libdrm2
            - libdbus-1-3
            - libxkbcommon0
            - libatspi2.0-0
            - libxcomposite1
            - libxdamage1
            - libxfixes3
            - libxrandr2
            - libgbm1
            - libasound2
            - libpango-1.0-0
            - libcairo2
      - pip:
          install:
            - trafilatura
            - requests
            - pyyaml
            - patchright
            - playwright
      - run:
          - mkdir -p /opt/playwright && chmod 777 /opt/playwright
          - playwright install chromium
          - patchright install chromium

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  ingest:
    command: python workspace/ingest_web.py
    description: Extract structured content from a web article
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/mnt/shared"
