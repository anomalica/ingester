names:
  image: anomalica-ingester-web
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ../output:/mnt/output:rw
    - ../shared:/mnt/shared:ro

stages:
  base:
    from: python:3.12-slim
    steps:
      - pip:
          install:
            - trafilatura
            - requests
            - pyyaml

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  ingest:
    command: python workspace/ingest_web.py
    description: Extract structured content from a web article
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/mnt/shared"
