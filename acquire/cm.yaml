names:
  image: anomalica-ingester-acquire
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ../staging:/mnt/staging:rw

stages:
  base:
    from: python:3.12-slim
    steps:
      - env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      - apt-get:
          install:
            - ffmpeg
            - libnss3
            - libnspr4
            - libatk1.0-0
            - libatk-bridge2.0-0
            - libcups2
            - libdrm2
            - libdbus-1-3
            - libxkbcommon0
            - libatspi2.0-0
            - libxcomposite1
            - libxdamage1
            - libxfixes3
            - libxrandr2
            - libgbm1
            - libasound2
            - libpango-1.0-0
            - libcairo2
            - git
            # nodesource (Node 22, required by the bgutil PO-token server) prereqs
            - curl
            - ca-certificates
            - gnupg
            # build toolchain + libs for the bgutil server's native `canvas` dep
            # (BotGuard fingerprinting) - node-gyp compiles it from source
            - build-essential
            - pkg-config
            - libcairo2-dev
            - libpango1.0-dev
            - libjpeg-dev
            - libgif-dev
            - librsvg2-dev
      - pip:
          install:
            - requests
            - pyyaml
            - patchright
            - playwright
            - yt-dlp
            # PO-token provider plugin (yt-dlp uses it automatically to get past
            # YouTube's download gating). PINNED and version-MATCHED to the Node
            # server built below - bgutil requires the plugin and provider to be
            # the same version. Bump both together.
            - bgutil-ytdlp-pot-provider==1.3.2
      - run:
          # Node 22 (bgutil server requires >=22; Debian's apt nodejs is 20). Also
          # provides npm for single-file-cli and the bgutil build below.
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs && rm -rf /var/lib/apt/lists/*
          - mkdir -p /opt/playwright && chmod 777 /opt/playwright
          - playwright install chromium
          - patchright install chromium
          - npm install -g single-file-cli
          # PO-token provider in SCRIPT mode: build the bgutil Node server so
          # generate_once.js exists at the path fetch/ytdlp.py looks for
          # (/opt/bgutil/server/build/generate_once.js). Without it yt-dlp cannot
          # sign media URLs and every YouTube fetch fails as "no downloadable audio
          # format". Version MUST match the pip plugin above. Needs Node 22+
          # (nodesource, above; bgutil 1.3.2 requires >=22), git, and the canvas
          # build deps - all added above.
          - git clone --single-branch --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil
            && cd /opt/bgutil/server && npm ci && npx tsc

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  acquire:
    command: python workspace/acquire.py
    description: Fetch a URL and stage the result for format-specific processing
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: workspace
