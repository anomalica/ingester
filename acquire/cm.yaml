names:
  image: anomalica-ingester-acquire
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ../staging:/mnt/staging:rw

stages:
  base:
    from: python:3.12-slim
    steps:
      - env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      - apt-get:
          install:
            - ffmpeg
            - libnss3
            - libnspr4
            - libatk1.0-0
            - libatk-bridge2.0-0
            - libcups2
            - libdrm2
            - libdbus-1-3
            - libxkbcommon0
            - libatspi2.0-0
            - libxcomposite1
            - libxdamage1
            - libxfixes3
            - libxrandr2
            - libgbm1
            - libasound2
            - libpango-1.0-0
            - libcairo2
            - nodejs
            - npm
      - pip:
          install:
            - requests
            - pyyaml
            - patchright
            - playwright
            - yt-dlp
            # PO-token provider plugin: yt-dlp uses it automatically to get past
            # YouTube's download gating when a bgutil provider is reachable.
            - bgutil-ytdlp-pot-provider
      - run:
          - mkdir -p /opt/playwright && chmod 777 /opt/playwright
          - playwright install chromium
          - patchright install chromium
          - npm install -g single-file-cli

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  acquire:
    command: python workspace/acquire.py
    description: Fetch a URL and stage the result for format-specific processing
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: workspace
