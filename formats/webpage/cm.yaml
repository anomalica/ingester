names:
  image: anomalica-ingester-webpage
  workspace: workspace
  user: nonroot
runtime:
  features: []
  volumes:
    - ../../staging:/mnt/staging:ro
    - ../../shared:/mnt/shared:ro
    - ../../../anomalica-common/src:/opt/anomalica-common:ro
stages:
  base:
    from: python:3.12-slim
    steps:
      - pip:
          install:
            - trafilatura
            - pyyaml
            - beautifulsoup4
            - lxml
            - requests
            - pydantic
  development:
    from: base
    steps:
      - pip:
          install:
            - pytest
  production:
    from: base
    steps:
      - copy: workspace
commands:
  ingest:
    command: python workspace/ingest_webpage.py
    description: Extract structured content from a pre-fetched web page
    mounts:
      output:
        mode: rw
        prefix: "--output-dir "
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/mnt/shared:/opt/anomalica-common"
