names:
  image: anomalica-ingester-webpage
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ../../staging:/mnt/staging:ro
    - ../../../anomalica-ingests:/mnt/output:rw
    - ../../shared:/mnt/shared:ro

stages:
  base:
    from: python:3.12-slim
    steps:
      - pip:
          install:
            - trafilatura
            - pyyaml

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  ingest:
    command: python workspace/ingest_webpage.py
    description: Extract structured content from a pre-fetched web page
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/mnt/shared"
