names:
  image: anomalica-ingester-pdf
  workspace: workspace
  user: nonroot

runtime:
  features: []
  volumes:
    - ~/.local/bin/claude:/usr/local/bin/claude:ro
    - ~/.claude:~/.claude
    - ../../staging:/mnt/staging:ro
    - ../../../ingests:/mnt/output:rw

stages:
  base:
    from: python:3.12-slim
    steps:
      - apt-get:
          install:
            - curl
      - pip:
          install:
            - anthropic
            - pikepdf
            - pyyaml
            - pymupdf
            - requests

  development:
    from: base
    steps:
      - pip:
          install:
            - pytest

  production:
    from: base
    steps:
      - copy: workspace

commands:
  ingest:
    command: python workspace/ingest_pdf.py
    description: Extract structured content from a PDF
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: workspace
